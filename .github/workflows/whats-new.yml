# Keeps the "What's new" list on the home page current.
# Runs whenever something is pushed to main, once a day (for new blog posts),
# and on demand from the Actions tab ("Run workflow").
name: Update What's new

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * *"   # daily, about 7am Pacific
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whats-new
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the What's new list
        run: python3 scripts/build_feed.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update What's new"
          git push
