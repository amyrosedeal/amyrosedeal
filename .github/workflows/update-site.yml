# Keeps the website in step with the CV.
#
# When cv/cv-full.tex changes: builds the CV PDF (ARDeal.pdf) and regenerates
# the Research, Talks and Teaching pages and "What's new" on the home page.
# Also runs once a day (to pick up new blog posts) and on demand from the
# Actions tab ("Run workflow").
name: Update site from CV

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * *"   # daily, about 7am Pacific
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # always build from the latest version, not the commit that started this run
          fetch-depth: 0

      - name: Did the CV change?
        # Rebuild the PDF if anything in cv/ changed since the PDF was last built
        # (so an upload is never missed, even if two arrive close together).
        id: cv
        run: |
          last_pdf=$(git log -1 --format=%H -- ARDeal.pdf)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$last_pdf" ] || \
             [ -n "$(git log --format=%H "$last_pdf"..HEAD -- cv/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the CV PDF
        if: steps.cv.outputs.changed == 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv-full.tex
          working_directory: cv

      - name: Use it as the site's CV
        if: steps.cv.outputs.changed == 'true'
        run: cp cv/cv-full.pdf ARDeal.pdf

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Regenerate Research, Talks, Teaching and What's new
        run: python3 scripts/build_site.py

      - name: Save any changes
        run: |
          git add ARDeal.pdf index.html research.html talks.html teaching.html accepted-dates.txt blog-latest.txt
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update site from CV"
          # If something new reached main while this ran (a second CV upload a
          # few minutes later, say), don't push: that upload starts its own run,
          # which rebuilds everything, including any CV change made before it.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD~1)" ]; then
            echo "Something newer is on main; its own run will update the site."
            exit 0
          fi
          git push origin HEAD:main
